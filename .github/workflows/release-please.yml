name: Release Please

# Keeps a release pull request open on main: it bumps the version in
# .release-please-manifest.json and writes CHANGELOG.md from the Conventional
# Commits since the last release. Merging it tags vX.Y.Z and creates the GitHub
# release with those notes; release.yml then builds, signs and attaches the
# provider archives that the Terraform Registry picks up.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # tag, GitHub release, release branch
      pull-requests: write # the release pull request
      issues: write        # its "autorelease" labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release pull request is opened with the workflow token, so it does
  # not trigger pull_request workflows. Dispatch the full acceptance tier on
  # its branch instead; release.yml refuses to release code that has not
  # passed it.
  release-pr-acceptance:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch acceptance.yml
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: gh workflow run acceptance.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
      actions: read # release.yml checks the acceptance runs
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
