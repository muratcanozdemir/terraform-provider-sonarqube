name: Release

# Builds the provider for every platform at a tag vX.Y.Z and attaches to the
# GitHub release what the Terraform Registry needs:
#   terraform-provider-sonarqube_X.Y.Z_<os>_<arch>.zip
#   terraform-provider-sonarqube_X.Y.Z_SHA256SUMS      (+ .sig, GPG-signed)
#   terraform-provider-sonarqube_X.Y.Z_manifest.json
# plus SLSA build provenance for every archive, verifiable with
# `gh attestation verify`.
#
# Requires the secrets GPG_PRIVATE_KEY (ASCII-armored) and GPG_PASSPHRASE; the
# matching public key must be added to the namespace on registry.terraform.io.
#
# It first waits for, or refuses without, a passing full acceptance run of
# the tagged code (acceptance-gate).
#
# release-please (.github/workflows/release-please.yml) calls this workflow with
# the tag it has just created, because tags pushed with the workflow token do
# not trigger workflows. Pushing a tag by hand also works.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag vX.Y.Z to build and release
        required: true
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # A release ships only code that passed the full acceptance tier: every
  # Community Build version, Enterprise and the migration job. See
  # scripts/release-gate.sh.
  acceptance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-gate.sh "$TAG"

  release:
    needs: acceptance-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write     # upload release assets
      id-token: write     # Sigstore signing certificate for the attestations
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # GoReleaser reads tags
          persist-credentials: false

      - name: Check tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The Go version CI tested and govulncheck checked (go.mod).
          go-version-file: go.mod
          cache: false # a release is built from fresh downloads only

      - name: Unit tests
        run: go test -race ./...

      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
